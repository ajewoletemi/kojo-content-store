services:
  - type: web
    name: kojo-content-store
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BITCOIN_ADDRESS
        sync: false
      - key: SITE_NAME
        value: Kojo Tools Store
