services:
  - type: web
    name: kojo-content-store
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # you must set this manually in the dashboard
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BITCOIN_ADDRESS
        sync: false
      - key: SITE_NAME
        value: Kojo Tools Store
