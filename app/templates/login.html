<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · {{ site_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="logo">Kojo <span class="rest">Tools Store</span></div>
      <p class="subtitle">Sign in to access products & services</p>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-blue btn-full" style="margin-top:0.4rem;">Sign In</button>
      </form>

      <p style="text-align:center; margin-top:1.4rem; font-size:0.9rem; color:#64748b;">
        No account? <a href="/register">Create one free</a>
      </p>
    </div>
  </div>
</body>
</html>
