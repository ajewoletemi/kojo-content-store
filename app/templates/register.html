<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register · {{ site_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="logo">Kojo <span class="rest">Tools Store</span></div>
      <p class="subtitle">Create your free account</p>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/register">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="full_name" placeholder="Your name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required placeholder="Min. 6 characters" minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-blue btn-full" style="margin-top:0.4rem;">Create Account</button>
      </form>

      <p style="text-align:center; margin-top:1.4rem; font-size:0.9rem; color:#64748b;">
        Already have an account? <a href="/login">Sign in</a>
      </p>
    </div>
  </div>
</body>
</html>
