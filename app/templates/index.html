{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-12 text-center">
    <h1 class="text-4xl font-bold mb-4">Welcome to {{ site_name }}</h1>
    <p class="text-lg mb-8">Premium Digital Tools & Templates</p>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    {% for product in products %}
        <div class="bg-white p-6 rounded-lg shadow">
            <img src="{{ product.image_url or '/static/placeholder.png' }}" class="w-full h-48 object-cover rounded mb-4">
            <h3 class="text-xl font-bold">{{ product.name }}</h3>
            <p class="text-gray-600 my-2">{{ product.description }}</p>
            <p class="text-2xl font-bold text-green-600">${{ "%.2f"|format(product.price_usd) }}</p>
        </div>
    {% endfor %}
    </div>
</div>
{% endblock %}
